name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a commit SHA (the tag is in the comment): a moved tag cannot change what
# runs with our token. Bump them on purpose, one at a time.

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Integration tests run a real mongod (replica set). Keep the binary between runs.
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-7.0.24-${{ runner.os }}

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      # Coverage gates live in each package's vitest config (domain 95%, schemas/marks 85%,
      # api 80%, ui 50%): a drop below its zone fails this step.
      - name: Tests with coverage
        run: pnpm test:coverage
        env:
          MONGOMS_VERSION: 7.0.24

      - name: Build
        run: pnpm build

  security:
    name: Dependencies, licenses, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Licenses
        run: node scripts/check-licenses.mjs

      - name: Secrets in the history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
