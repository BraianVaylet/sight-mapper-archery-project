name: Archer feedback
description: Something went wrong, felt slow or was missing while using Sight Mapper
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Sight Mapper. Do not paste passwords or your session. Marks and distances are fine.
  - type: dropdown
    id: kind
    attributes:
      label: What is it?
      options:
        - Something broke
        - The mark shown was not the one I set
        - It was slow or hard to use outdoors
        - Something was missing
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you doing, what did you expect and what did you see?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or computer and browser
      placeholder: Android 15, Chrome, installed as an app
  - type: dropdown
    id: where
    attributes:
      label: Where were you?
      options:
        - At home
        - At the range or in the field
        - Other
