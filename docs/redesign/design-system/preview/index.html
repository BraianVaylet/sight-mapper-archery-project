<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sight Mapper — Design System (preview local)</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css">
<style>
 body{padding:24px} header{display:flex;gap:16px;align-items:center;margin-bottom:24px}
 h1{font:700 28px/32px var(--font-display);margin:0;flex:1}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:24px}
 figure{margin:0;background:var(--surface);border:2px solid var(--border);border-radius:4px;overflow:hidden}
 figcaption{padding:8px 12px;font:600 12px/16px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);border-bottom:2px solid var(--border)}
 iframe{display:block;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body class="sm-blueprint">
<header><h1>Sight Mapper · Design System</h1>
<div class="sm-lang" role="group" aria-label="Tema"><button class="sm-lang__opt" aria-pressed="true" data-t="dark">DARK</button><button class="sm-lang__opt" aria-pressed="false" data-t="light">LIGHT</button></div></header>
<div class="grid" id="g"></div>
<script>
// Abre este archivo con un servidor estatico (p.ej. `npx serve docs/redesign/design-system`) y navega a /preview/.
// Cada preview se carga en un iframe con tokens.css + bundle.css inyectados, como lo hace el artefacto.
var C=[['Cover',300],['Button',290],['Field',430],['Segmented',200],['StatusBadge',96],['InfoAlert',260],['Toast',200],['EmptyState',520],['SectionCard',230],['AppHeader',170],['NavDrawer',720],['BottomSheet',440],['BlueprintGrid',320],['ReadingHud',200],['SightRuler',440],['SetupCard',480],['ActionBar',230],['LanguageSwitch',100],['SightScreen',1240],['HomeScreen',900],['SettingsScreen',1000],['SignInScreen',720]];
var g=document.getElementById('g'),theme='dark';
function load(f){var d=f.contentDocument;if(!d)return;d.documentElement.setAttribute('data-theme',theme);
 if(!d.getElementById('sm-inj')){var h=d.head;['../tokens.css','../components/bundle.css'].forEach(function(u,i){var l=d.createElement('link');l.rel='stylesheet';l.href=new URL(u,location.href).href;if(i===0)l.id='sm-inj';h.insertBefore(l,h.firstChild);});}}
C.forEach(function(c){var fig=document.createElement('figure');fig.innerHTML='<figcaption>'+c[0]+'</figcaption>';var f=document.createElement('iframe');f.style.height=c[1]+'px';f.src='../components/'+c[0]+'/preview.html';f.onload=function(){load(f)};fig.appendChild(f);g.appendChild(fig);});
document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){theme=b.dataset.t;document.documentElement.setAttribute('data-theme',theme);document.querySelectorAll('[data-t]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});document.querySelectorAll('iframe').forEach(load);}});
</script>
</body></html>
