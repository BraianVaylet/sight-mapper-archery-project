<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>InfoAlert</title>
<style>body{background:transparent} </style></head>
<body class="">

<div class="sm-stack sm-pad" style="max-width:480px">
  <div class="sm-alert sm-alert--info" role="status"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="7"/><path d="M8 7v5M8 4.5v.5" stroke-linecap="round"/></svg><div class="sm-alert__body">Con 2 marcas ya podés calcular las intermedias.</div></div>
  <div class="sm-alert sm-alert--warning" role="status"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2l6.5 11.5h-13zM8 6.5v3M8 11v.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="sm-alert__body"><span class="sm-alert__title">La marca de 40 m parece mal medida</span>Se aleja 0,4 de la curva de las demás.</div></div>
  <div class="sm-alert sm-alert--danger" role="alert"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="7"/><path d="M5 5l6 6M11 5l-6 6" stroke-linecap="round"/></svg><div class="sm-alert__body">No pudimos guardar. Revisá la conexión.</div></div>
</div>
</body>
</html>
