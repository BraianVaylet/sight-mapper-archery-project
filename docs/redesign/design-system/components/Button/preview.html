<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button</title>
<style>body{background:transparent} </style></head>
<body class="">

<div class="sm-stack sm-pad" style="max-width:520px">
  <div class="sm-row">
    <button class="sm-btn sm-btn--primary"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>Agregar marca</button>
    <button class="sm-btn">Cancelar</button>
    <button class="sm-btn sm-btn--ghost"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M7 9V3h10v6M7 17H4V9h16v8h-3M7 14h10v7H7z"/></svg>Imprimir</button>
    <button class="sm-btn sm-btn--icon" aria-label="Abrir menú"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div class="sm-row">
    <button class="sm-btn sm-btn--link">Olvidé mi contraseña</button>
    <button class="sm-btn sm-btn--danger"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>Mover a la papelera</button>
    <button class="sm-btn sm-btn--primary" disabled>Guardando…</button>
  </div>
  <button class="sm-btn sm-btn--primary sm-btn--block sm-btn--lg"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>Crear setup</button>
</div>
</body>
</html>
