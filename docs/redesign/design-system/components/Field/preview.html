<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Field</title>
<style>body{background:transparent} </style></head>
<body class="">

<div class="sm-stack sm-pad" style="max-width:420px">
  <div class="sm-field"><label class="sm-field__label" for="f1">Nombre del arco</label><div class="sm-field__control"><input id="f1" class="sm-input" value="PSE Evo NXT 35"></div></div>
  <div class="sm-field"><label class="sm-field__label" for="f2">Libraje</label><div class="sm-field__control"><input id="f2" class="sm-input sm-input--num sm-input--suffix" inputmode="decimal" value="52,5"><span class="sm-field__suffix">lb</span></div><p class="sm-field__hint">Acepta coma o punto.</p></div>
  <div class="sm-field"><label class="sm-field__label" for="f3">Lectura de mira</label><div class="sm-field__control"><input id="f3" class="sm-input sm-input--num" aria-invalid="true" value="12,4" aria-describedby="f3e"></div><p id="f3e" class="sm-field__error"><svg width="16" height="16" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="7"/><path d="M5 5l6 6M11 5l-6 6" stroke-linecap="round"/></svg>Fuera de la escala (1 a 9).</p></div>
  <div class="sm-field"><label class="sm-field__label" for="f4">Set de flechas</label><select id="f4" class="sm-input"><option>Gold Tip Pierce Platinum 400</option><option>Gold Tip Hunter 400</option></select></div>
  <div class="sm-field"><label class="sm-field__label" for="f5">Contraseña</label><div class="sm-row" style="flex-wrap:nowrap;gap:8px"><input id="f5" type="password" class="sm-input" value="secreto123"><button class="sm-btn sm-btn--link" aria-pressed="false">Mostrar</button></div></div>
</div>
</body>
</html>
